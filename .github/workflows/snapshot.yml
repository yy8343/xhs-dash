name: daily-snapshot
on:
  schedule:
    - cron: '5 1 * * *'   # 每天 09:05 北京时间，生成前一天快照
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshot
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SNAPSHOT: '1'
          OUT_DIR: /tmp/public
        run: node scripts/build.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || (git commit -m "snapshot $(date -u +%F)" && git push)
